services:
  n8n:
    environment:
      N8N_HOST: ${N8N_PUBLIC_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_PUBLIC_HOST}/
      N8N_WEBHOOK_URL: https://${N8N_PUBLIC_HOST}/
      N8N_PROXY_HOPS: "2"
    networks:
      agroflow_backend:
      castel_proxy:
        aliases:
          - agroflow-n8n

networks:
  castel_proxy:
    name: castel_network
    external: true
