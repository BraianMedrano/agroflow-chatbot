# BLOCKED: do not install this file yet.
#
# Read-only certificate metadata did not prove that the certificate currently
# used for casteltech.ar covers n8n.casteltech.ar. Before installation, an
# operator must add ssl_certificate and ssl_certificate_key directives using
# verified in-container paths for a certificate whose SAN contains either
# n8n.casteltech.ar or *.casteltech.ar. No certificate paths are guessed here.

map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name n8n.casteltech.ar;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name n8n.casteltech.ar;

    # BLOCKED: add the two verified certificate directives here.

    location / {
        proxy_pass http://agroflow-n8n:5678;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
